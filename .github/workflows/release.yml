name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config gperf \
            libblkid-dev libselinux1-dev libkmod-dev

      - name: autogen
        run: autoreconf -fi

      - name: configure
        run: ./configure --prefix=/overlayer/syshub

      - name: build
        run: make -j$(nproc)

      - name: test
        run: make check

      - name: build dist tarball
        run: make dist

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
