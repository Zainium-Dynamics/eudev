name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prefix: ["/overlayer/syshub", "/usr"]
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config gperf \
            libblkid-dev libselinux1-dev libkmod-dev

      - name: autogen
        run: autoreconf -fi

      - name: configure (--prefix=${{ matrix.prefix }})
        run: ./configure --prefix=${{ matrix.prefix }}

      - name: build
        run: make -j$(nproc)

      - name: test
        run: make check

      - name: show config summary on failure
        if: failure()
        run: cat config.log
